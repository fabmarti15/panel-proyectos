<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar familiar</title>
<style>
:root{
  color-scheme: light;
  --bg:#FFFFFF; --surface:#FBFBFA; --line:#EDEDEA; --line-2:#F5F5F3;
  --t1:#1D1D1F; --t2:#6B6B70; --t3:#A6A6AB;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg); color:var(--t1); font-family:var(--sans); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}

/* puerta */
#puerta{min-height:100%; display:flex; align-items:center; justify-content:center; padding:28px}
.caja{width:100%; max-width:340px; text-align:center}
.caja h1{font-size:19px; font-weight:600; letter-spacing:-.015em; margin-bottom:6px}
.caja p{font-size:13.5px; color:var(--t3); margin-bottom:22px}
.caja input{width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1px solid var(--line); border-radius:11px; background:var(--surface); text-align:center; letter-spacing:.08em}
.caja input:focus{outline:none; border-color:#CFCFC9; background:#FFF}
.caja button{width:100%; margin-top:10px; font:inherit; font-size:15px; font-weight:500; padding:12px; border:0; border-radius:11px; background:var(--t1); color:#FFF; cursor:pointer}
.caja button:disabled{opacity:.45; cursor:default}
.caja .err{font-size:13px; color:#B5795C; margin-top:12px; min-height:19px}

/* panel */
#panel{display:none; height:100%; flex-direction:column}
nav{display:flex; align-items:center; gap:4px; padding:9px 14px; border-bottom:1px solid var(--line); background:var(--bg); flex-wrap:wrap}
nav button{appearance:none; border:0; background:transparent; font:inherit; font-size:14px; color:var(--t2); padding:7px 12px; border-radius:9px; cursor:pointer}
nav button:hover{background:var(--line-2)}
nav button[aria-pressed=true]{background:var(--line-2); color:var(--t1); font-weight:500}
nav .salir{margin-left:auto; font-size:12.5px; color:var(--t3); padding:7px 10px}
iframe{flex:1; width:100%; border:0; background:var(--bg)}
</style>
</head>
<body>

<div id="puerta">
  <div class="caja">
    <h1>Radar familiar</h1>
    <p>Colegio, deportes y contabilidad</p>
    <form id="f">
      <input id="clave" type="password" placeholder="clave" autocomplete="current-password" autofocus>
      <button id="ok" type="submit">Entrar</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="panel">
  <nav id="nav"></nav>
  <iframe id="vista" title="Panel"></iframe>
</div>

<script src="datos.js"></script>
<script>
(function(){
  var f=document.getElementById('f'), inp=document.getElementById('clave'),
      btn=document.getElementById('ok'), err=document.getElementById('err'),
      puerta=document.getElementById('puerta'), panel=document.getElementById('panel'),
      nav=document.getElementById('nav'), vista=document.getElementById('vista');
  var paginas=null;

  function deB64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }

  function abrir(clave){
    var s=window.RADAR_DATOS;
    return crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        return crypto.subtle.deriveKey({name:"PBKDF2", salt:deB64(s.salt), iterations:s.iter, hash:"SHA-256"},
          base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      })
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:deB64(s.iv)}, k, deB64(s.ct)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)).paginas; });
  }

  function mostrar(id){
    var p=paginas.filter(function(x){return x.id===id;})[0] || paginas[0];
    vista.srcdoc=p.html;
    [].slice.call(nav.querySelectorAll('button[data-id]')).forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.id===p.id ? 'true':'false');
    });
    if(location.hash.slice(1)!==p.id){ history.replaceState(null,'','#'+p.id); }
  }

  function render(){
    paginas.forEach(function(p){
      var b=document.createElement('button');
      b.textContent=p.titulo; b.dataset.id=p.id;
      b.addEventListener('click',function(){ mostrar(p.id); });
      nav.appendChild(b);
    });
    var s=document.createElement('button');
    s.className='salir'; s.textContent='Salir';
    s.addEventListener('click',function(){ location.reload(); });
    nav.appendChild(s);
    puerta.style.display='none';
    panel.style.display='flex';
    mostrar(location.hash.slice(1)||'inicio');
  }

  window.addEventListener('hashchange',function(){ if(paginas) mostrar(location.hash.slice(1)); });

  f.addEventListener('submit',function(e){
    e.preventDefault();
    if(!window.RADAR_DATOS){ err.textContent='No se cargaron los datos.'; return; }
    btn.disabled=true; err.textContent='Abriendo…';
    abrir(inp.value).then(function(ps){ paginas=ps; err.textContent=''; render(); })
      .catch(function(){ err.textContent='Clave incorrecta.'; btn.disabled=false; inp.select(); });
  });
})();
</script>
</body>
</html>

    document.getElementById('acceso').addEventListener('submit',async e=>{
      e.preventDefault();
      const error=document.getElementById('error'); error.textContent='';
      try{
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('clave').value),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(DATOS.salt),iterations:DATOS.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
        const claro=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(DATOS.iv)},key,bytes(DATOS.ciphertext));
        document.open(); document.write(new TextDecoder().decode(claro)); document.close();
      }catch(_){error.textContent='Contraseña incorrecta.'}
    });

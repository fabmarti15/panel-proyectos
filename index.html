<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de proyectos</title>
<style>
:root{ --bg:#fff; --fg:#16181a; --dim:#8b8d90; --line:#e8e8e6; --hov:#f7f7f5; --ojo:#b4463c; --verde:#2c6e54; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:48px 28px 96px}

/* puerta */
#puerta{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:50}
#puerta .c{width:260px;text-align:center}
#puerta h1{font-size:15px;font-weight:600;margin:0 0 3px}
#puerta p{font-size:12.5px;color:var(--dim);margin:0 0 18px}
#puerta input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:7px;
  font:inherit;text-align:center}
#puerta input:focus{outline:none;border-color:var(--fg)}
#puerta .e{font-size:12px;color:var(--ojo);height:16px;margin-top:8px}

/* cabecera */
h1.t{font-size:16px;font-weight:600;margin:0}
.meta{font-size:12.5px;color:var(--dim);margin:3px 0 22px}
.barra{display:flex;gap:10px;align-items:center;margin-bottom:4px;flex-wrap:wrap;
  position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:10;border-bottom:1px solid transparent}
.barra.pegada{border-bottom-color:var(--line)}
#q{flex:1;min-width:180px;border:0;border-bottom:1px solid var(--line);padding:6px 2px;
  font:inherit;background:transparent;color:var(--fg)}
#q:focus{outline:none;border-bottom-color:var(--fg)}
.f{border:0;background:transparent;color:var(--dim);font:inherit;font-size:12.5px;
  cursor:pointer;padding:4px 2px}
.f:hover{color:var(--fg)}
.f[aria-pressed="true"]{color:var(--fg);font-weight:600}

/* grupos */
.g{margin-top:38px}
.g h2{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.g h2 .n{font-weight:400}
.g h2::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}

/* grilla de tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);
  cursor:pointer;transition:box-shadow .15s ease,transform .15s ease;position:relative;
  display:flex;flex-direction:column}
.card:hover{box-shadow:0 6px 20px -8px rgba(22,24,26,.18);transform:translateY(-2px)}
.card.muda{cursor:default}
.card.muda:hover{box-shadow:none;transform:none}
.thumb{aspect-ratio:16/10;background:var(--hov);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;
  border-bottom:1px solid var(--line)}
.thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:600;border-bottom:1px solid var(--line)}
.thumb .info{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  border:1px solid rgba(22,24,26,.25);background:rgba(255,255,255,.88);color:var(--fg);
  font-size:12.5px;line-height:22px;text-align:center;cursor:pointer;opacity:0;transition:opacity .12s}
.card:hover .info,.card.muda .info{opacity:1}
.thumb .info:hover{border-color:var(--fg)}
.cuerpo{padding:11px 13px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-size:13.5px;font-weight:600;line-height:1.3;color:var(--fg)}
.card.muda .nm{color:var(--dim);font-weight:500}
.fila2{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:10.5px;white-space:nowrap}
.chip.publico{color:var(--verde);border-color:rgba(44,110,84,.35)}
.chip.clave{color:#7a5a1e;border-color:rgba(122,90,30,.35)}
.chip.caido{color:var(--ojo);border-color:rgba(180,70,60,.35)}
.veces{color:var(--fg);font-weight:600}
.d1{font-size:12px;color:var(--dim);line-height:1.45;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pt{position:absolute;top:10px;left:10px;width:8px;height:8px;border-radius:50%;
  background:var(--ojo);box-shadow:0 0 0 2px #fff}

/* modal detalle */
#velo{position:fixed;inset:0;background:rgba(22,24,26,.35);display:none;z-index:40}
#velo.ab{display:flex;align-items:center;justify-content:center;padding:20px}
#modal{background:var(--bg);border-radius:12px;max-width:460px;width:100%;padding:22px 24px;
  box-shadow:0 18px 60px -12px rgba(0,0,0,.35);max-height:85vh;overflow:auto}
#modal h3{font-size:15px;margin:0 0 2px}
#modal .md{font-size:12.5px;color:var(--dim);margin-bottom:14px}
#modal .det div{display:flex;gap:10px;font-size:12.5px;line-height:1.8}
#modal .det b{font-weight:400;color:var(--dim);min-width:78px;flex:none}
#modal .det span{color:var(--fg);word-break:break-all}
#modal .det .al{color:var(--ojo)}
#modal button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;
  font-size:12px;border-radius:6px;padding:4px 12px;cursor:pointer;margin:12px 8px 0 0}
#modal button:hover{border-color:var(--fg)}
.oculto{display:none!important}
#vacio{color:var(--dim);font-size:13px;padding:30px 0;display:none}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .cuerpo{padding:9px 10px 11px}.d1{display:none}}
</style>
</head>
<body>

<div id="puerta"><div class="c">
  <h1>Panel de proyectos</h1>
  <p>Todo lo que tengo publicado.</p>
  <input id="pw" type="password" placeholder="Clave" autocomplete="off" autofocus>
  <div class="e" id="e"></div>
</div></div>

<div class="wrap" id="app" hidden>
  <h1 class="t">Panel de proyectos</h1>
  <div class="meta" id="meta"></div>

  <div class="barra" id="barra">
    <input id="q" placeholder="Buscar…">
    <button class="f" data-f="todos" aria-pressed="true">Todos</button>
    <button class="f" data-f="vivos" aria-pressed="false">Con URL</button>
    <button class="f" data-f="publico" aria-pressed="false">Abiertos</button>
    <button class="f" data-f="clave" aria-pressed="false">Con clave</button>
    <button class="f" data-f="atencion" aria-pressed="false">Ojo</button>
  </div>

  <div id="lista"></div>
  <div id="vacio">Nada calza con eso.</div>
</div>

<div id="velo"><div id="modal"></div></div>

<script src="datos.js"></script>
<script>
(function(){
"use strict";
var ETIQ={publico:"Abierto",clave:"Con clave",repo:"Solo repo",caido:"Caído",
  pendiente:"Sin publicar",local:"Solo local"};
var VIVOS={publico:1,clave:1,repo:1};
var PALETA=["#eef4f0","#f4f0ea","#eef1f5","#f5efef","#f0f0ea","#eef4f4","#f4eef2","#f1f1f1"];
var TINTA=["#2c6e54","#8a6a2f","#3d5a80","#a05252","#6b6b35","#2f7a7a","#8a4f74","#555"];
var datos=null, filtro="todos", porSlug={};

var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var corta=function(u){return u.replace(/^https?:\/\//,"").replace(/\/$/,"");};
function slug(s){
  s=s.toLowerCase().replace(/^https?:\/\//,"").normalize("NFD").replace(/[̀-ͯ]/g,"");
  return s.replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80);
}
function idDe(it){return slug(it.u||it.t);}

/* ── contador de aperturas (por navegador) ── */
function clics(){try{return JSON.parse(localStorage.getItem("panel-clics")||"{}")}catch(e){return{}}}
function sumaClic(id){var c=clics();c[id]=(c[id]||0)+1;
  try{localStorage.setItem("panel-clics",JSON.stringify(c))}catch(e){}}

/* ── descifrado ── */
function deB64(s){var b=atob(s),a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function abrir(clave,s){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"])
    .then(function(base){return crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:deB64(s.salt),iterations:s.iter,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);})
    .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:deB64(s.iv)},k,deB64(s.ct));})
    .then(function(b){return JSON.parse(new TextDecoder().decode(b));});
}

/* ── render ── */
function tarjeta(it,gi){
  var viva=!!it.u, id=idDe(it), n=clics()[id]||0;
  var busca=esc([it.t,it.d,it.u,it.c,ETIQ[it.a]].join(" ").toLowerCase());
  var mini=viva&&datos.minis&&datos.minis[slug(it.u)];
  var thumb=mini
    ? '<img loading="lazy" alt="" src="data:image/webp;base64,'+mini+'">'
    : '<div class="ph" style="background:'+PALETA[gi%PALETA.length]+';color:'+TINTA[gi%TINTA.length]+'">'+esc((it.t||"?").replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]*/,"").charAt(0).toUpperCase())+'</div>';
  return '<div class="card'+(viva?'':' muda')+'" data-id="'+esc(id)+'" data-b="'+busca+'" data-a="'+it.a+'"'+
    (it.alerta?' data-oj="1"':'')+(viva&&VIVOS[it.a]?' data-v="1"':'')+'>'+
    '<div class="thumb">'+thumb+(it.alerta?'<i class="pt"></i>':'')+
      '<span class="info" title="Detalle">i</span></div>'+
    '<div class="cuerpo"><div class="nm">'+esc(it.t)+'</div>'+
    '<div class="fila2"><span class="chip '+esc(it.a)+'">'+ETIQ[it.a]+'</span>'+
      (it.f?'<span>'+esc(it.f)+'</span>':'')+
      (n?'<span class="veces">×'+n+'</span>':'')+'</div>'+
    (it.d?'<div class="d1">'+esc(it.d)+'</div>':'')+
    '</div></div>';
}

function pinta(){
  var c=clics(), n=0, tot=0;
  Object.keys(c).forEach(function(k){tot+=c[k]});
  datos.grupos.forEach(function(g){n+=g.items.length;});
  document.getElementById("meta").textContent=n+" proyectos · corte "+datos.corte+
    (tot?" · "+tot+(tot===1?" apertura":" aperturas")+" en este navegador":"");
  porSlug={};
  document.getElementById("lista").innerHTML=datos.grupos.map(function(g,gi){
    var items=g.items.slice().map(function(it,i){porSlug[idDe(it)]=it;return{it:it,i:i}});
    items.sort(function(a,b){return (c[idDe(b.it)]||0)-(c[idDe(a.it)]||0)||a.i-b.i;});
    return '<section class="g" data-g><h2>'+esc(g.nombre)+
      '<span class="n">'+g.items.length+'</span></h2><div class="grid">'+
      items.map(function(x){return tarjeta(x.it,gi)}).join("")+'</div></section>';
  }).join("");
  aplica();
}

function aplica(){
  var q=document.getElementById("q").value.trim().toLowerCase(), v=0;
  [].forEach.call(document.querySelectorAll(".card"),function(el){
    var ok=!q||el.dataset.b.indexOf(q)!==-1;
    if(ok){
      var a=el.dataset.a;
      if(filtro==="vivos")    ok=el.dataset.v==="1";
      if(filtro==="publico")  ok=a==="publico";
      if(filtro==="clave")    ok=a==="clave";
      if(filtro==="atencion") ok=el.dataset.oj==="1";
    }
    el.classList.toggle("oculto",!ok); if(ok)v++;
  });
  [].forEach.call(document.querySelectorAll("[data-g]"),function(g){
    var cn=g.querySelectorAll(".card:not(.oculto)").length;
    g.classList.toggle("oculto",!cn);
    g.querySelector(".n").textContent=cn;
  });
  document.getElementById("vacio").style.display=v?"none":"block";
}

/* ── modal ── */
function abrirModal(it){
  var id=idDe(it), n=clics()[id]||0, d=[];
  d.push('<div><b>Estado</b><span>'+ETIQ[it.a]+'</span></div>');
  if(it.u) d.push('<div><b>URL</b><span>'+esc(corta(it.u))+'</span></div>');
  if(it.r&&it.r!==it.u) d.push('<div><b>Repo</b><span>'+esc(corta(it.r))+'</span></div>');
  if(it.c) d.push('<div><b>Carpeta</b><span>'+esc(it.c)+'</span></div>');
  if(it.pass) d.push('<div><b>Clave</b><span>'+esc(it.pass)+'</span></div>');
  if(it.alerta) d.push('<div><b>Ojo</b><span class="al">'+esc(it.alerta)+'</span></div>');
  d.push('<div><b>Aperturas</b><span>'+(n||"ninguna todavía")+'</span></div>');
  document.getElementById("modal").innerHTML=
    '<h3>'+esc(it.t)+'</h3><div class="md">'+esc(it.d||"")+'</div>'+
    '<div class="det">'+d.join("")+'</div>'+
    (it.u?'<button type="button" id="mAbrir">Abrir</button><button type="button" id="mCopiar">Copiar URL</button>':'')+
    '<button type="button" id="mCerrar">Cerrar</button>';
  document.getElementById("velo").classList.add("ab");
  var ab=document.getElementById("mAbrir");
  if(ab) ab.onclick=function(){sumaClic(id);window.open(it.u,"_blank","noopener");cierraModal();pinta();};
  var cp=document.getElementById("mCopiar");
  if(cp) cp.onclick=function(){
    if(navigator.clipboard) navigator.clipboard.writeText(it.u);
    cp.textContent="Copiado";setTimeout(function(){cp.textContent="Copiar URL"},1200);};
  document.getElementById("mCerrar").onclick=cierraModal;
}
function cierraModal(){document.getElementById("velo").classList.remove("ab");}
document.getElementById("velo").addEventListener("click",function(e){
  if(e.target.id==="velo")cierraModal();});

/* ── eventos ── */
document.addEventListener("click",function(e){
  var info=e.target.closest(".info");
  if(info){e.stopPropagation();
    abrirModal(porSlug[info.closest(".card").dataset.id]);return;}
  var card=e.target.closest(".card");
  if(!card)return;
  var it=porSlug[card.dataset.id];
  if(it&&it.u){sumaClic(card.dataset.id);window.open(it.u,"_blank","noopener");pinta();}
  else if(it)abrirModal(it);
});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&document.getElementById("velo").classList.contains("ab")){cierraModal();return;}
  var q=document.getElementById("q");
  if(document.getElementById("puerta")) return;
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==="Escape"&&document.activeElement===q){q.value="";aplica();q.blur();}
});

document.getElementById("q").addEventListener("input",aplica);
[].forEach.call(document.querySelectorAll(".f"),function(b){
  b.addEventListener("click",function(e){
    e.stopPropagation();
    filtro=b.dataset.f;
    [].forEach.call(document.querySelectorAll(".f"),function(o){
      o.setAttribute("aria-pressed",String(o===b));});
    aplica();
  });
});

var pw=document.getElementById("pw"), er=document.getElementById("e");
pw.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter") return;
  er.textContent="Abriendo…";
  abrir(pw.value,window.PANEL_DATOS).then(function(d){
    datos=d;
    document.getElementById("puerta").remove();
    document.getElementById("app").hidden=false;
    pinta();
  },function(){ er.textContent="Clave incorrecta"; pw.select(); });
});
pw.focus();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de proyectos</title>
<style>
:root{ --bg:#fff; --fg:#16181a; --dim:#8b8d90; --line:#e8e8e6; --hov:#f7f7f5; --ojo:#b4463c; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:56px 24px 96px}

/* puerta */
#puerta{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:50}
#puerta .c{width:260px;text-align:center}
#puerta h1{font-size:15px;font-weight:600;margin:0 0 3px}
#puerta p{font-size:12.5px;color:var(--dim);margin:0 0 18px}
#puerta input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:7px;
  font:inherit;text-align:center}
#puerta input:focus{outline:none;border-color:var(--fg)}
#puerta .e{font-size:12px;color:var(--ojo);height:16px;margin-top:8px}

/* cabecera */
h1.t{font-size:16px;font-weight:600;margin:0}
.meta{font-size:12.5px;color:var(--dim);margin:3px 0 26px}
.barra{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap;
  position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10}
#q{flex:1;min-width:180px;border:0;border-bottom:1px solid var(--line);padding:6px 2px;
  font:inherit;background:transparent;color:var(--fg)}
#q:focus{outline:none;border-bottom-color:var(--fg)}
.f{border:0;background:transparent;color:var(--dim);font:inherit;font-size:12.5px;
  cursor:pointer;padding:4px 2px}
.f:hover{color:var(--fg)}
.f[aria-pressed="true"]{color:var(--fg);font-weight:600}

/* grupos */
.g{margin-top:34px}
.g h2{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin:0 0 2px;display:flex;justify-content:space-between}
.g h2 span{font-weight:400}

/* filas */
.it{border-bottom:1px solid var(--line);padding:13px 0;cursor:pointer}
.it:hover{background:var(--hov);box-shadow:-10px 0 0 var(--hov),10px 0 0 var(--hov)}
.r1{display:flex;align-items:baseline;gap:12px}
.nm{font-weight:500;text-decoration:none;color:var(--fg);flex:1}
.nm:hover{text-decoration:underline}
.it.mudo .nm{color:var(--dim)}
.fe{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.d1{font-size:12.5px;color:var(--dim);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.it.ab .d1{white-space:normal}
.pt{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ojo);
  margin-left:6px;vertical-align:2px}
.det{display:none;margin-top:10px;font-size:12.5px;color:var(--dim);line-height:1.7}
.it.ab .det{display:block}
.det div{display:flex;gap:10px}
.det b{font-weight:400;color:var(--dim);min-width:74px}
.det span{color:var(--fg);word-break:break-all}
.det .al{color:var(--ojo)}
.det button{border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;
  font-size:12px;border-radius:6px;padding:3px 10px;cursor:pointer;margin-top:8px}
.det button:hover{border-color:var(--fg)}
.oculto{display:none}
#vacio{color:var(--dim);font-size:13px;padding:30px 0;display:none}
</style>
</head>
<body>

<div id="puerta"><div class="c">
  <h1>Panel de proyectos</h1>
  <p>Todo lo que tengo publicado.</p>
  <input id="pw" type="password" placeholder="Clave" autocomplete="off" autofocus>
  <div class="e" id="e"></div>
</div></div>

<div class="wrap" id="app" hidden>
  <h1 class="t">Panel de proyectos</h1>
  <div class="meta" id="meta"></div>

  <div class="barra">
    <input id="q" placeholder="Buscar…">
    <button class="f" data-f="todos" aria-pressed="true">Todos</button>
    <button class="f" data-f="vivos" aria-pressed="false">Con URL</button>
    <button class="f" data-f="publico" aria-pressed="false">Abiertos</button>
    <button class="f" data-f="clave" aria-pressed="false">Con clave</button>
    <button class="f" data-f="atencion" aria-pressed="false">Ojo</button>
  </div>

  <div id="lista"></div>
  <div id="vacio">Nada calza con eso.</div>
</div>

<script src="datos.js"></script>
<script>
(function(){
"use strict";
var ETIQ={publico:"Abierto",clave:"Con clave",repo:"Solo repo",caido:"Caído",
  pendiente:"Sin publicar",local:"Solo local"};
var VIVOS={publico:1,clave:1,repo:1};
var datos=null, filtro="todos";

var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var corta=function(u){return u.replace(/^https?:\/\//,"").replace(/\/$/,"");};

/* ── descifrado ── */
function deB64(s){var b=atob(s),a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function abrir(clave,s){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"])
    .then(function(base){return crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:deB64(s.salt),iterations:s.iter,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);})
    .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:deB64(s.iv)},k,deB64(s.ct));})
    .then(function(b){return JSON.parse(new TextDecoder().decode(b));});
}

/* ── render ── */
function fila(it){
  var viva=!!it.u;
  var busca=esc([it.t,it.d,it.u,it.c,ETIQ[it.a]].join(" ").toLowerCase());
  var nom=viva
    ? '<a class="nm" href="'+esc(it.u)+'" target="_blank" rel="noopener">'+esc(it.t)+'</a>'
    : '<span class="nm">'+esc(it.t)+'</span>';

  var d=[];
  d.push('<div><b>Estado</b><span>'+ETIQ[it.a]+'</span></div>');
  if(viva) d.push('<div><b>URL</b><span>'+esc(corta(it.u))+'</span></div>');
  if(it.r&&it.r!==it.u) d.push('<div><b>Repo</b><span>'+esc(corta(it.r))+'</span></div>');
  if(it.c) d.push('<div><b>Carpeta</b><span>'+esc(it.c)+'</span></div>');
  if(it.pass) d.push('<div><b>Clave</b><span>'+esc(it.pass)+'</span></div>');
  if(it.alerta) d.push('<div><b>Ojo</b><span class="al">'+esc(it.alerta)+'</span></div>');
  if(viva) d.push('<button type="button" class="cp">Copiar URL</button>');

  return '<div class="it'+(viva?'':' mudo')+'" data-b="'+busca+'" data-a="'+it.a+'"'+
    (it.alerta?' data-oj="1"':'')+(viva&&VIVOS[it.a]?' data-v="1"':'')+
    (viva?' data-u="'+esc(it.u)+'"':'')+'>'+
    '<div class="r1">'+nom+(it.alerta?'<i class="pt"></i>':'')+
      '<span class="fe">'+esc(it.f||"")+'</span></div>'+
    (it.d?'<div class="d1">'+esc(it.d)+'</div>':'')+
    '<div class="det">'+d.join("")+'</div></div>';
}

function pinta(){
  var n=0; datos.grupos.forEach(function(g){n+=g.items.length;});
  document.getElementById("meta").textContent=n+" proyectos · corte "+datos.corte;
  document.getElementById("lista").innerHTML=datos.grupos.map(function(g){
    return '<section class="g" data-g><h2>'+esc(g.nombre)+
      '<span class="n">'+g.items.length+'</span></h2>'+
      g.items.map(fila).join("")+'</section>';
  }).join("");
  aplica();
}

function aplica(){
  var q=document.getElementById("q").value.trim().toLowerCase(), v=0;
  [].forEach.call(document.querySelectorAll(".it"),function(el){
    var ok=!q||el.dataset.b.indexOf(q)!==-1;
    if(ok){
      var a=el.dataset.a;
      if(filtro==="vivos")    ok=el.dataset.v==="1";
      if(filtro==="publico")  ok=a==="publico";
      if(filtro==="clave")    ok=a==="clave";
      if(filtro==="atencion") ok=el.dataset.oj==="1";
    }
    el.classList.toggle("oculto",!ok); if(ok)v++;
  });
  [].forEach.call(document.querySelectorAll("[data-g]"),function(g){
    var c=g.querySelectorAll(".it:not(.oculto)").length;
    g.classList.toggle("oculto",!c);
    g.querySelector(".n").textContent=c;
  });
  document.getElementById("vacio").style.display=v?"none":"block";
}

/* ── eventos ── */
document.addEventListener("click",function(e){
  var cp=e.target.closest(".cp");
  if(cp){
    e.stopPropagation();
    var u=cp.closest(".it").dataset.u;
    var ok=function(){cp.textContent="Copiado";
      setTimeout(function(){cp.textContent="Copiar URL";},1300);};
    if(navigator.clipboard) navigator.clipboard.writeText(u).then(ok,function(){}); else ok();
    return;
  }
  if(e.target.closest(".nm[href]")) return;      /* el nombre abre la URL */
  var it=e.target.closest(".it");
  if(it) it.classList.toggle("ab");
});

document.addEventListener("keydown",function(e){
  var q=document.getElementById("q");
  if(document.getElementById("puerta")) return;
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==="Escape"&&document.activeElement===q){q.value="";aplica();q.blur();}
});

document.getElementById("q").addEventListener("input",aplica);
[].forEach.call(document.querySelectorAll(".f"),function(b){
  b.addEventListener("click",function(e){
    e.stopPropagation();
    filtro=b.dataset.f;
    [].forEach.call(document.querySelectorAll(".f"),function(o){
      o.setAttribute("aria-pressed",String(o===b));});
    aplica();
  });
});

var pw=document.getElementById("pw"), er=document.getElementById("e");
pw.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter") return;
  er.textContent="Abriendo…";
  abrir(pw.value,window.PANEL_DATOS).then(function(d){
    datos=d;
    document.getElementById("puerta").remove();
    document.getElementById("app").hidden=false;
    pinta();
  },function(){ er.textContent="Clave incorrecta"; pw.select(); });
});
pw.focus();
})();
</script>
</body>
</html>
